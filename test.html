<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>בדיקה עצמית</title>
<style>body{font:15px/1.7 ui-monospace,monospace;padding:20px;max-width:760px;margin:auto}
.ok{color:#0a0}.bad{color:#d00;font-weight:700}h1{font-size:1.1rem}</style></head>
<body><h1>בדיקה עצמית — שיטוח בזיירים + כתיבת DXF</h1><pre id="out">מריץ…</pre>
<script type="module">
import { pdfToPolys, bbox } from "./js/pdf.js";
import { toDXF } from "./js/dxf.js";

// 200x150pt page: a stroked 10x10mm square at the origin + live Helvetica text "AB".
const PDF_B64 = "JVBERi0xLjQKMSAwIG9iago8PC9UeXBlL0NhdGFsb2cvUGFnZXMgMiAwIFI+PgplbmRvYmoKMiAwIG9iago8PC9UeXBlL1BhZ2VzL0tpZHNbMyAwIFJdL0NvdW50IDE+PgplbmRvYmoKMyAwIG9iago8PC9UeXBlL1BhZ2UvUGFyZW50IDIgMCBSL01lZGlhQm94WzAgMCAyMDAgMTUwXS9SZXNvdXJjZXM8PC9Gb250PDwvRjEgNSAwIFI+Pj4+L0NvbnRlbnRzIDQgMCBSPj4KZW5kb2JqCjQgMCBvYmoKPDwvTGVuZ3RoIDg1Pj4Kc3RyZWFtCjAgMCBtIDI4LjM0NjUgMCBsIDI4LjM0NjUgMjguMzQ2NSBsIDAgMjguMzQ2NSBsIGggUwpCVCAvRjEgMjQgVGYgNTAgMTAwIFRkIChBQikgVGogRVQKZW5kc3RyZWFtCmVuZG9iago1IDAgb2JqCjw8L1R5cGUvRm9udC9TdWJ0eXBlL1R5cGUxL0Jhc2VGb250L0hlbHZldGljYT4+CmVuZG9iagp4cmVmCjAgNgowMDAwMDAwMDAwIDY1NTM1IGYgCjAwMDAwMDAwMDkgMDAwMDAgbiAKMDAwMDAwMDA1NCAwMDAwMCBuIAowMDAwMDAwMTA1IDAwMDAwIG4gCjAwMDAwMDAyMTcgMDAwMDAgbiAKMDAwMDAwMDM1MCAwMDAwMCBuIAp0cmFpbGVyCjw8L1NpemUgNi9Sb290IDEgMCBSPj4Kc3RhcnR4cmVmCjQxMwolJUVPRgo=";

const log = [];
let failed = 0;
const check = (name, cond, extra = "") => {
  log.push(`${cond ? "✓" : "✗"} ${name}${extra ? "  — " + extra : ""}`);
  if (!cond) failed++;
};

try {
  const bytes = Uint8Array.from(atob(PDF_B64), c => c.charCodeAt(0));
  const { polys } = pdfToPolys(bytes);

  // The square is the only 4-point closed polyline; the glyphs are curvy and dense.
  const square = polys.find(p => p.closed && p.pts.length === 4);
  check("הריבוע נמצא כנתיב סגור בן 4 נקודות", !!square,
        `סה"כ ${polys.length} נתיבים`);

  if (square) {
    const b = bbox([square]);
    check('רוחב הריבוע = 10.00 מ"מ', Math.abs(b.w - 10) < 0.01, b.w.toFixed(4));
    check('גובה הריבוע = 10.00 מ"מ', Math.abs(b.h - 10) < 0.01, b.h.toFixed(4));
    check('הריבוע יושב בפינת העמוד (0,0)',
          Math.abs(b.x0) < 0.01 && Math.abs(b.y0) < 0.01,
          `(${b.x0.toFixed(3)}, ${b.y0.toFixed(3)})`);
  }

  // Live text must have come through as outlines, not been dropped.
  const glyphs = polys.filter(p => p !== square && p.pts.length > 8);
  check("טקסט חי הומר לקווי מתאר", glyphs.length >= 2, `${glyphs.length} נתיבי גליף`);
  check("עקומות שוטחו לנקודות מרובות",
        glyphs.every(p => p.pts.length > 8));

  const dxf = toDXF(polys);
  check("DXF הוא R12", dxf.includes("AC1009"));
  check("משתמש ב-POLYLINE ולא ב-LWPOLYLINE",
        dxf.includes("POLYLINE") && !dxf.includes("LWPOLYLINE"));
  check("דגל 'ורטקסים עוקבים' (66) קיים", /\r\n66\r\n1\r\n/.test(dxf));
  check("אין SPLINE / BLOCK", !dxf.includes("SPLINE") && !dxf.includes("INSERT"));
  check("מספר ה-VERTEX תואם לנקודות",
        (dxf.match(/\nVERTEX\r/g) || []).length ===
        polys.reduce((s, p) => s + p.pts.length, 0));
  // A closed POLYLINE must not repeat its first vertex.
  check("נתיב סגור אינו משכפל את נקודת ההתחלה",
        polys.filter(p => p.closed).every(p => {
          const a = p.pts[0], z = p.pts[p.pts.length - 1];
          return Math.hypot(a[0] - z[0], a[1] - z[1]) > 0.001;
        }));
} catch (e) {
  log.push("✗ נפל: " + e.message);
  failed++;
  console.error(e);
}

log.push("", failed ? `${failed} בדיקות נכשלו` : "הכל עבר");
document.getElementById("out").innerHTML =
  log.map(l => `<span class="${l.startsWith("✗") || /נכשלו/.test(l) ? "bad" : l.startsWith("✓") || l === "הכל עבר" ? "ok" : ""}">${l}</span>`).join("\n");
document.title = failed ? "נכשל" : "עבר";
</script></body></html>
