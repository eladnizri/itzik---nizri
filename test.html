<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>בדיקה עצמית</title>
<style>body{font:14px/1.75 ui-monospace,monospace;padding:20px;max-width:860px;margin:auto}
.ok{color:#0a0}.bad{color:#d00;font-weight:700}.h{font-weight:700;display:block;margin-top:14px}
h1{font-size:1.1rem}</style></head>
<body><h1>בדיקה עצמית — דיוק ההמרה</h1><pre id="out">מריץ…</pre>
<script type="module">
import { pdfToPolys } from "./js/pdf.js";
import { imageToPolys } from "./js/raster.js";
import { bbox } from "./js/svg.js";
import { toDXF } from "./js/dxf.js";
import { unfold, stripPolys } from "./js/unfold.js";

const PDF_B64 = "JVBERi0xLjQKMSAwIG9iago8PC9UeXBlL0NhdGFsb2cvUGFnZXMgMiAwIFI+PgplbmRvYmoKMiAwIG9iago8PC9UeXBlL1BhZ2VzL0tpZHNbMyAwIFJdL0NvdW50IDE+PgplbmRvYmoKMyAwIG9iago8PC9UeXBlL1BhZ2UvUGFyZW50IDIgMCBSL01lZGlhQm94WzAgMCAyMDAgMTUwXS9SZXNvdXJjZXM8PC9Gb250PDwvRjEgNSAwIFI+Pj4+L0NvbnRlbnRzIDQgMCBSPj4KZW5kb2JqCjQgMCBvYmoKPDwvTGVuZ3RoIDg1Pj4Kc3RyZWFtCjAgMCBtIDI4LjM0NjUgMCBsIDI4LjM0NjUgMjguMzQ2NSBsIDAgMjguMzQ2NSBsIGggUwpCVCAvRjEgMjQgVGYgNTAgMTAwIFRkIChBQikgVGogRVQKZW5kc3RyZWFtCmVuZG9iago1IDAgb2JqCjw8L1R5cGUvRm9udC9TdWJ0eXBlL1R5cGUxL0Jhc2VGb250L0hlbHZldGljYT4+CmVuZG9iagp4cmVmCjAgNgowMDAwMDAwMDAwIDY1NTM1IGYgCjAwMDAwMDAwMDkgMDAwMDAgbiAKMDAwMDAwMDA1NCAwMDAwMCBuIAowMDAwMDAwMTA1IDAwMDAwIG4gCjAwMDAwMDAyMTcgMDAwMDAgbiAKMDAwMDAwMDM1MCAwMDAwMCBuIAp0cmFpbGVyCjw8L1NpemUgNi9Sb290IDEgMCBSPj4Kc3RhcnR4cmVmCjQxMwolJUVPRgo="; // 200x150pt page: stroked 10x10mm square at origin + live text "AB"

const log = [], head = (t) => log.push(`\n§ ${t}`);
let failed = 0;
const check = (name, cond, extra = "") => {
  log.push(`${cond ? "✓" : "✗"} ${name}${extra ? "  — " + extra : ""}`);
  if (!cond) failed++;
};
const canvasOf = (w, h, draw) => {
  const c = Object.assign(document.createElement("canvas"), { width: w, height: h });
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.fillStyle = "#000"; draw(x);
  return c;
};

try {
  // ============ PDF route ============
  head("PDF וקטורי");
  const { polys: pp } = pdfToPolys(Uint8Array.from(atob(PDF_B64), c => c.charCodeAt(0)));
  const square = pp.find(p => p.closed && p.pts.length === 4);
  check("ריבוע נמצא כנתיב סגור בן 4 נקודות", !!square, `סה"כ ${pp.length} נתיבים`);
  if (square) {
    const b = bbox([square]);
    check('רוחב = 10.000 מ"מ', Math.abs(b.w - 10) < 0.001, b.w.toFixed(4));
    check('גובה = 10.000 מ"מ', Math.abs(b.h - 10) < 0.001, b.h.toFixed(4));
    check("ממוקם ב-(0,0)", Math.abs(b.x0) < 0.001 && Math.abs(b.y0) < 0.001,
          `(${b.x0.toFixed(4)}, ${b.y0.toFixed(4)})`);
  }
  const glyphs = pp.filter(p => p !== square);
  check("טקסט חי הומר לקווי מתאר", glyphs.length >= 4, `${glyphs.length} תת-נתיבי גליף`);

  // ============ Raster route ============
  // 400x400 canvas, black square covering pixels 100..299 -> edges at 100 and 300.
  head('תמונה — ריבוע 200×200 פיקסל, רוחב יעד 100 מ"מ (0.25 מ"מ/פיקסל)');
  const sq = await imageToPolys(canvasOf(400, 400, x => x.fillRect(100, 100, 200, 200)),
                                { widthMM: 100 });
  check("נתיב אחד בלבד (הרקע הלבן לא נעקב)", sq.polys.length === 1, `${sq.polys.length}`);
  const sb = bbox(sq.polys);
  check('רוחב = 50.000 מ"מ בדיוק', Math.abs(sb.w - 50) < 0.001, sb.w.toFixed(4));
  check('גובה = 50.000 מ"מ בדיוק', Math.abs(sb.h - 50) < 0.001, sb.h.toFixed(4));
  check('מיקום X = 25.000 מ"מ', Math.abs(sb.x0 - 25) < 0.001, sb.x0.toFixed(4));
  check('מיקום Y = 25.000 מ"מ', Math.abs(sb.y0 - 25) < 0.001, sb.y0.toFixed(4));
  check("הנתיב סגור", sq.polys[0].closed);
  // Sharp corners must survive: a 4-corner shape should not become a blob of nodes.
  check("פינות נשארו חדות (≤8 נקודות)", sq.polys[0].pts.length <= 8,
        `${sq.polys[0].pts.length} נקודות`);
  check("סף אוטומטי (Otsu) באמצע הטווח", sq.threshold > 110 && sq.threshold < 145, `t=${sq.threshold}`);

  head('תמונה — עיגול קוטר 300 פיקסל, רוחב יעד 100 מ"מ → 75 מ"מ צפוי');
  const ci = await imageToPolys(
    canvasOf(400, 400, x => { x.beginPath(); x.arc(200, 200, 150, 0, 7); x.fill(); }),
    { widthMM: 100 });
  const cb = bbox(ci.polys);
  check('קוטר אופקי = 75 מ"מ ±0.4 (1.5 פיקסל)', Math.abs(cb.w - 75) < 0.4, cb.w.toFixed(3));
  check('קוטר אנכי = 75 מ"מ ±0.4 (1.5 פיקסל)', Math.abs(cb.h - 75) < 0.4, cb.h.toFixed(3));
  // Radial error against the ideal circle - this is the real accuracy of a traced image.
  const cx = (cb.x0 + cb.x1) / 2, cy = (cb.y0 + cb.y1) / 2;
  const rs = ci.polys[0].pts.map(([x, y]) => Math.hypot(x - cx, y - cy));
  const dev = rs.map(r => Math.abs(r - 37.5));
  const maxDev = Math.max(...dev), avgDev = dev.reduce((a, b) => a + b, 0) / dev.length;
  check('סטייה רדיאלית מרבית < 0.25 מ"מ (= פיקסל אחד)', maxDev < 0.25,
        `מרבית ${maxDev.toFixed(3)} · ממוצעת ${avgDev.toFixed(3)} מ"מ`);

  head("תמונה — טבעת (בדיקת חורים)");
  const dn = await imageToPolys(canvasOf(400, 400, x => {
    x.beginPath(); x.arc(200, 200, 150, 0, 7); x.fill();
    x.globalCompositeOperation = "destination-out";
    x.beginPath(); x.arc(200, 200, 75, 0, 7); x.fill();
  }), { widthMM: 100 });
  check("שני נתיבים: חיצוני + חור", dn.polys.length === 2, `${dn.polys.length}`);
  check("שניהם סגורים", dn.polys.every(p => p.closed));
  const [big, small] = dn.polys.map(p => bbox([p])).sort((a, b) => b.w - a.w);
  check('חור בקוטר ≈ 37.5 מ"מ', Math.abs(small.w - 37.5) < 0.3, small.w.toFixed(3));

  // ============ Flat pattern ============
  head("פריסה — STAND MECHBA1660-37 (צלעות 61/25.6/29, T=3, R=1, 90°)");
  const u = unfold({ legs: [61, 25.6, 29], thickness: 3, radius: 1, angle: 90, k: 0.33 });
  check("סכום הצלעות = 115.60", Math.abs(u.sum - 115.6) < 1e-9, u.sum.toFixed(2));
  check("Bend Allowance = 3.126", Math.abs(u.BA - 3.1259) < 0.001, u.BA.toFixed(4));
  check("Setback = 4.000 (90° → R+T)", Math.abs(u.SB - 4) < 1e-9, u.SB.toFixed(4));
  check("ניכוי לכיפוף = 4.874", Math.abs(u.BD - 4.8741) < 0.001, u.BD.toFixed(4));
  check("אורך פרוס = 105.85", Math.abs(u.length - 105.8518) < 0.001, u.length.toFixed(4));
  check("שני אזורי כיפוף", u.zones.length === 2);
  check("רוחב כל אזור = BA", u.zones.every(([a, b]) => Math.abs(b - a - u.BA) < 1e-9));
  check("אזורים בתוך הפס ובסדר עולה",
        u.zones[0][0] > 0 && u.zones[0][1] < u.zones[1][0] && u.zones[1][1] < u.length,
        u.zones.map(z => z.map(v => v.toFixed(2)).join("–")).join(" , "));
  // Identity: total must equal the sum of what is laid out, however many legs there are.
  for (const legs of [[20, 20], [10, 10, 10, 10], [5, 40, 5]]) {
    const v = unfold({ legs, thickness: 2, radius: 1.5, angle: 90, k: 0.42 });
    check(`${legs.length} צלעות: אורך = סכום − ${legs.length - 1}×ניכוי`,
          Math.abs(v.length - (v.sum - (legs.length - 1) * v.BD)) < 1e-9);
  }
  // Legs of 60: an obtuse bend has a large setback, so short legs are genuinely impossible.
  for (const angle of [30, 90, 135, 170]) {
    const v = unfold({ legs: [60, 60], thickness: 1.5, radius: 2, angle, k: 0.4 });
    check(`זווית ${angle}°: אורך חיובי וקטן מהסכום`, v.length > 0 && v.length < v.sum,
          v.length.toFixed(3));
  }
  const throws = (o) => { try { unfold(o); return false; } catch { return true; } };
  check("זווית 180° נדחית ולא מחזירה מספר שגוי",
        throws({ legs: [30, 30], thickness: 1.5, radius: 2, angle: 180, k: 0.4 }));
  check("זווית 0° נדחית", throws({ legs: [30, 30], thickness: 1.5, radius: 2, angle: 0, k: 0.4 }));
  check("צלע קצרה מהסטבק נדחית",
        throws({ legs: [2, 30], thickness: 3, radius: 5, angle: 90, k: 0.4 }));

  head("פלט DXF של הפס");
  const sp = stripPolys(u.length, 25.6, u.zones);
  check("נתיב חיתוך אחד + 4 קווי כיפוף", sp.length === 5);
  const stripBox = bbox(sp);
  check('מלבן 105.85 × 25.60', Math.abs(stripBox.w - u.length) < 1e-9 && Math.abs(stripBox.h - 25.6) < 1e-9,
        `${stripBox.w.toFixed(3)} × ${stripBox.h.toFixed(3)}`);
  const sdxf = toDXF(sp);
  check("טבלת LAYER קיימת", /TABLE\r\n\s*2\r\nLAYER/.test(sdxf) || sdxf.includes("LAYER"));
  check("שכבות CUT ו-BEND שתיהן בקובץ",
        sdxf.includes("CUT") && sdxf.includes("BEND"));
  check("קו כיפוף פתוח, קו חיתוך סגור",
        sp.filter(p => p.layer === "BEND").every(p => !p.closed) &&
        sp.find(p => p.layer === "CUT").closed);

  head("פלט DXF");
  const all = [...pp, ...sq.polys, ...ci.polys, ...dn.polys];
  const dxf = toDXF(all);
  check("R12 (AC1009)", dxf.includes("AC1009"));
  check("POLYLINE ולא LWPOLYLINE", dxf.includes("POLYLINE") && !dxf.includes("LWPOLYLINE"));
  check("דגל 66 קיים", /\r\n66\r\n1\r\n/.test(dxf));
  check("אין SPLINE / INSERT", !dxf.includes("SPLINE") && !dxf.includes("INSERT"));
  check("מספר VERTEX תואם", (dxf.match(/\nVERTEX\r/g) || []).length ===
        all.reduce((s, p) => s + p.pts.length, 0));
  check("נתיב סגור לא משכפל נקודת התחלה", all.filter(p => p.closed).every(p => {
    const a = p.pts[0], z = p.pts[p.pts.length - 1];
    return Math.hypot(a[0] - z[0], a[1] - z[1]) > 0.001;
  }));
} catch (e) {
  log.push("✗ נפל: " + e.message); failed++; console.error(e);
}

log.push("", failed ? `${failed} בדיקות נכשלו` : "הכל עבר");
document.getElementById("out").innerHTML = log.map(l =>
  `<span class="${l.startsWith("✗")||/נכשלו/.test(l) ? "bad" : l.startsWith("§") ? "h" :
    l.startsWith("✓")||l==="הכל עבר" ? "ok" : ""}">${l}</span>`).join("\n");
document.title = failed ? "נכשל" : "עבר";
</script></body></html>
